<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account · Attend-It</title>
<link rel="stylesheet" href="css/create-account.css"/>
</head>

<body>

<div class="bg-gradient"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div id="toast" class="toast"></div>

<main class="create-wrap">

  <section class="glass-card create-card">

    <div class="brand">
      <img src="pic/complogo.jpeg" class="logo-sm" alt="Attend-It Logo">

      <div>
        <h1>Create Account</h1>
        <p>Create your Attend-It employee account</p>
      </div>
    </div>

    <form id="createForm">

      <h3>Personal Information</h3>

      <div class="form-grid">

        <div class="field">
          <label>Full Name</label>
          <input id="name" type="text" placeholder="Full Name" required>
        </div>

        <div class="field">
          <label>Employee ID</label>
          <input id="employeeId" type="text" placeholder="id" required>
        </div>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" placeholder="email" required>
        </div>

        <div class="field">
          <label>Phone</label>
          <input id="phone" type="tel" placeholder="+91......" required>
        </div>

      </div>


      <h3>Employment Information</h3>

      <div class="form-grid">

        <div class="field">
          <label>Department</label>
          <input id="department" type="text" placeholder="department" required>
        </div>

        <div class="field">
          <label>Designation</label>
          <input id="designation" type="text" placeholder="designation" required>
        </div>

        <div class="field">
          <label>Manager</label>
          <input id="manager" type="text" placeholder="Manager Name" required>
        </div>

        <div class="field">
          <label>Joining Date</label>
          <input id="joining" type="date" required>
        </div>

      </div>


      <h3>Login Information</h3>

      <div class="form-grid">

        <div class="field">
          <label>Login ID</label>
          <input id="loginId" type="text" placeholder="Choose your login ID" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input id="password" type="password" placeholder="Create password" required>
        </div>

        <div class="field">
          <label>Confirm Password</label>
          <input id="confirmPassword" type="password" placeholder="Confirm password" required>
        </div>

      </div>


      <div class="actions">

        <a href="index.html" class="btn btn-ghost">
          Back to Login
        </a>

        <button type="submit" class="btn btn-primary">
          Next →
        </button>

      </div>

    </form>

  </section>

</main>

<script src="js/create-account.js"></script>

</body>
</html>
