
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>K-Track · Sign In</title>
<link rel="stylesheet" href="css/login.css"/>
</head>

<body>

  <!-- Animated gradient background + floating blobs -->
  <div class="bg-gradient"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Loading screen -->
  <div id="loader" class="loader hidden">
    <div class="loader-ring"></div>
    <p>Authenticating…</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <main class="login-wrap">

    <section class="glass-card login-card">

      <!-- Brand -->
      <header class="brand">

        <div class="logo">
          <img src="pic/complogo.jpeg" alt="K-Track Logo">
        </div>

        <div>
          <h1>K-Track</h1>
          <p class="sub">Krones Attendance Tracker</p>
        </div>

      </header>

      <!-- Login Form -->
      <form id="loginForm" class="form" novalidate>

        <!-- Username -->
        <div class="field">
          <label for="username">Work Email or Username</label>
          <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="username"
            required
          />
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password</label>

          <div class="pw">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />

            <button
              type="button"
              id="togglePw"
              class="pw-toggle"
              aria-label="Show password"
            >
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  fill="currentColor"
                  d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-2a3 3 0 100-6 3 3 0 000 6z"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember + Forgot -->
        <div class="row between">

          <label class="check">
            <input type="checkbox" id="remember"/>
            <span>Remember me</span>
          </label>

          <a href="#" class="link" id="forgot">
            Forgot password?
          </a>

        </div>

        <!-- Create Account -->
        <div class="create-account-link">
          <span>Don't have an account?</span>
          <a href="create-account.html">Create Account</a>
        </div>

        <!-- Sign In -->
        <button
          type="submit"
          class="btn btn-primary ripple"
          id="loginBtn"
        >
          <span id="loginText">Sign In</span>
        </button>

      </form>

      <!-- Footer -->
      <footer class="card-footer">
        <span>© 2026 Krones.</span>
      </footer>

    </section>

  </main>

  <script src="js/login.js"></script>

</body>
</html>
```
